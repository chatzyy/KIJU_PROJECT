    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../../../../javascript/supabase.js"></script>

   <script>
    async function load() {
        try {
            const data = await API.dashboard();

            statBookings.textContent = data.bookings;
            statCustomers.textContent = data.customers;
            statIncome.textContent =
                data.income.toLocaleString() + ' บาท';
            statFree.textContent = data.free;

            const hours = Array.from(
                { length: 12 },
                (_, index) => index + 11
            );

            const maxBookings = Math.max(
                1,
                ...hours.map((hour) => data.byHour[hour] || 0)
            );

            chart.innerHTML = `
                <div class="flex h-40 items-end gap-2 p-3">
                    ${hours.map((hour) => `
                        <div class="flex-1 text-center text-xs">
                            <div
                                class="rounded-t bg-orange-500"
                                style="height: ${
                                    (data.byHour[hour] || 0)
                                    / maxBookings * 100
                                }%"
                            ></div>
                            ${hour}
                        </div>
                    `).join('')}
                </div>
            `;

        } catch (error) {
            console.error('Dashboard error:', error);
        }
    }

    load();

    API.live(
        ['reservations', 'income', 'restaurant_tables'],
        load
    );
</script>
