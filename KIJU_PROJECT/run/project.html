<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KIJU - หมูกระทะ ตะลุยซอย</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdn.boxicons.com/3.0.8/fonts/basic/boxicons.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Prompt', sans-serif; }
  </style>
</head>

<body class="min-h-screen bg-[#FBF8F4] text-gray-800 flex items-center justify-center p-4">
  <main class="w-full max-w-3xl">
    <div class="text-center mb-10">
      <div class="mx-auto mb-4 flex h-16 w-16 items-center justify-center rounded-2xl bg-orange-500 text-white shadow-lg">
        <svg class="h-9 w-9" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M17.657 18.657A8 8 0 016.343 7.343S7 9 9 10c0-2 .5-5 2.986-7C14 5 16.09 5.777 17.656 7.343A7.975 7.975 0 0120 13a7.975 7.975 0 01-2.343 5.657z"></path>
        </svg>
      </div>
      <h1 class="text-2xl sm:text-3xl font-bold">หมูกระทะ ตะลุยซอย</h1>
      <p class="mt-1 text-xs font-semibold tracking-widest text-orange-500">MOO KATA TALUI SOI</p>
      <p class="mt-4 text-gray-500">กรุณาเลือกเข้าสู่ระบบตามบทบาทของคุณ</p>
    </div>

    <div class="grid gap-5 sm:grid-cols-2">
      <!-- ลูกค้า -->
      <a id="go-user" href="../project/web/user/homepage_user/homepage_user.html"
        class="group rounded-3xl border border-gray-100 bg-white p-8 text-center shadow-sm transition hover:-translate-y-1 hover:border-orange-300 hover:shadow-xl focus:outline-none focus:ring-4 focus:ring-orange-200">
        <div class="mx-auto mb-5 flex h-20 w-20 items-center justify-center rounded-full bg-orange-50 text-orange-500 transition group-hover:bg-orange-500 group-hover:text-white">
          <svg class="h-10 w-10" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path>
          </svg>
        </div>
        <h2 class="text-xl font-semibold">สำหรับลูกค้า</h2>
        <p class="mt-2 text-sm text-gray-500">จองโต๊ะ ดูคิว และรับการแจ้งเตือน</p>
        <span class="mt-6 inline-block rounded-xl bg-orange-500 px-6 py-2.5 font-medium text-white transition group-hover:bg-orange-600">
          เข้าสู่หน้าลูกค้า →
        </span>
      </a>

      <!-- แอดมิน -->
      <a id="go-admin" href="../project/web/addmin/homepage_addmin/homepage_addmin.html"
        class="group rounded-3xl border border-gray-100 bg-white p-8 text-center shadow-sm transition hover:-translate-y-1 hover:border-gray-700 hover:shadow-xl focus:outline-none focus:ring-4 focus:ring-gray-300">
        <div class="mx-auto mb-5 flex h-20 w-20 items-center justify-center rounded-full bg-gray-100 text-gray-700 transition group-hover:bg-gray-800 group-hover:text-white">
          <svg class="h-10 w-10" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"></path>
          </svg>
        </div>
        <h2 class="text-xl font-semibold">สำหรับแอดมิน</h2>
        <p class="mt-2 text-sm text-gray-500">จัดการคิว โต๊ะ และดูแดชบอร์ด</p>
        <span class="mt-6 inline-block rounded-xl bg-gray-800 px-6 py-2.5 font-medium text-white transition group-hover:bg-black">
          เข้าสู่หน้าแอดมิน →
        </span>
      </a>
    </div>

    <p class="mt-10 text-center text-xs text-gray-400">KIJU Reservation System</p>
  </main>

</html>
