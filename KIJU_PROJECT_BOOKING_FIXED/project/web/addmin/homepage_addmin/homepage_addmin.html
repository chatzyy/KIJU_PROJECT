    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../../../../javascript/supabase.js"></script>

    <script>
        // ต้องมี id: totalTables, freeTables, todayQueue, notiBox, tableMap
        const color = {
            available: 'bg-amber-600',
            reserved: 'bg-red-500',
            occupied: 'bg-gray-500',
            cleaning: 'bg-blue-400',
        };

        async function load() {
            const tables = await API.tables();

            totalTables.textContent = tables.length;
            freeTables.textContent = tables.filter(
                (table) => table.status === 'available'
            ).length;

            const queue = await API.reservations(['waiting', 'called']);
            todayQueue.textContent = queue.length;

            notiBox.innerHTML = queue
                .slice(0, 3)
                .map((reservation) => `
                    <div>
                        คิว ${reservation.reservation_number}
                        โต๊ะ ${reservation.table_id}
                    </div>
                `)
                .join('') || 'ไม่มีรายการใหม่';

            tableMap.innerHTML = tables
                .map((table) => `
                    <button
                        data-id="${table.table_id}"
                        data-s="${table.status}"
                        class="rounded-xl p-2 font-bold ${color[table.status]}"
                    >
                        <div class="text-3xl">
                            <i class="bx bx-bench"></i>
                        </div>
                        ${table.table_id}
                    </button>
                `)
                .join('');

            tableMap.querySelectorAll('button').forEach((button) => {
                button.onclick = async () => {
                    if (button.dataset.s === 'cleaning') {
                        await API.setTableStatus(button.dataset.id, 'available');
                    }
                };
            });
        }

        load();
        API.live(['tables', 'reservations'], load);
    </script>
