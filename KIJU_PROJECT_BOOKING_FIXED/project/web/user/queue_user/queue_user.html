    <main class="flex-1 overflow-y-auto">
        <header class="border-b border-gray-200/50 px-8 py-6">

            <div

                class="rounded-2xl bg-white p-10 text-center text-gray-400"

                    class="text-orange-500"
                >
                    จองเลย
                </a>
            </div>

            <div
                id="qBox"
                hidden
                class="mx-auto max-w-md rounded-2xl border border-gray-100 bg-white p-10 text-center shadow-sm"
            >
                <div class="text-xs text-gray-400">หมายเลขคิวของคุณ</div>

                <div
                    id="qNumber"
                    class="my-4 text-7xl font-bold text-orange-500"
                ></div>

                <div class="space-y-1 text-sm">
                    โต๊ะ <b id="qTable"></b>
                    · เวลา <b id="qTime"></b>
                </div>

                <div
                    id="qStatus"
                    class="mt-4 inline-block rounded-full bg-orange-50 px-4 py-1 font-medium text-orange-600"
                ></div>

                <button
                    id="btnCancel"
                    class="mt-6 w-full rounded-xl border border-red-300 py-2 text-red-500"
                >
                    ยกเลิกคิว
                </button>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../../../../javascript/supabase.js"></script>

    <script>
        // ต้องมี id: qEmpty, qBox, qNumber, qTable, qStatus, qTime, btnCancel
        const elements = {
            empty: document.getElementById('qEmpty'),
            box: document.getElementById('qBox'),
            number: document.getElementById('qNumber'),
            table: document.getElementById('qTable'),
            status: document.getElementById('qStatus'),
            time: document.getElementById('qTime'),
            cancelButton: document.getElementById('btnCancel'),
        };

        const statusLabels = {
            waiting: 'รอเรียก',
            called: 'ถึงคิวแล้ว!',
            seated: 'กำลังทาน',
            cancelled: 'ยกเลิกแล้ว',
            no_show: 'หมดสิทธิ์',
            done: 'เสร็จสิ้น',
        };

        async function loadReservation() {
            const reservation = await API.myReservation();

            elements.empty.hidden = Boolean(reservation);
            elements.box.hidden = !reservation;

            if (!reservation) {
                return;
            }

            elements.number.textContent = reservation.reservation_number;
            elements.table.textContent = reservation.table_id;
            elements.status.textContent = statusLabels[reservation.status];

            elements.time.textContent = reservation.reservation_time;

            elements.cancelButton.hidden = !['waiting', 'called'].includes(
                reservation.status
            );
        }

        async function cancelReservation() {
            if (!confirm('ยืนยันยกเลิกคิว?')) {
                return;
            }

            const reservation = await API.myReservation();
            await API.setStatus(reservation, 'cancelled');
            await loadReservation();
        }

        elements.cancelButton.onclick = cancelReservation;

        loadReservation();
        API.live(['reservations'], loadReservation);
    </script>
