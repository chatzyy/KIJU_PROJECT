    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="/project/web/js/supabase.js"></script>

    <script>
        // ใช้ queueList แสดงรายการจอง
        async function load() {
            const rows = await API.reservations([
                'waiting',
                'called',
                'seated',
            ]);

            queueList.innerHTML = rows
                .map((reservation) => `
                    <div class="flex items-center justify-between rounded-xl border bg-white p-5">
                        <div>
                            <b>${reservation.reservation_number}</b>
                            โต๊ะ ${reservation.table_id}
                            · ${reservation.customers?.name || '-'}
                            (${reservation.party_size} คน)

                            <div class="text-xs">
                                ${new Date(reservation.reserved_time).toLocaleTimeString(
                                    'th-TH',
                                    {
                                        hour: '2-digit',
                                        minute: '2-digit',
                                    }
                                )}
                                · ${reservation.status}
                            </div>
                        </div>

                        <div class="flex gap-2 text-sm">
                            ${
                                reservation.status === 'waiting'
                                    ? `
                                        <button
                                            onclick="act(${reservation.reservation_id}, 'called')"
                                            class="rounded border px-3 py-1"
                                        >
                                            เรียก
                                        </button>
                                    `
                                    : ''
                            }

                            ${
                                reservation.status !== 'seated'
                                    ? `
                                        <button
                                            onclick="act(${reservation.reservation_id}, 'seated')"
                                            class="rounded bg-amber-500 px-3 py-1"
                                        >
                                            จัดที่นั่ง
                                        </button>

                                        <button
                                            onclick="act(${reservation.reservation_id}, 'no_show')"
                                            class="rounded border px-3 py-1"
                                        >
                                            ข้าม
                                        </button>

                                        <button
                                            onclick="act(${reservation.reservation_id}, 'cancelled')"
                                            class="rounded border px-3 py-1"
                                        >
                                            ยกเลิก
                                        </button>
                                    `
                                    : `
                                        <button
                                            onclick="act(${reservation.reservation_id}, 'checkout')"
                                            class="rounded bg-green-500 px-3 py-1"
                                        >
                                            เช็คบิล
                                        </button>
                                    `
                            }
                        </div>
                    </div>
                `)
                .join('') || '<div>ไม่มีรายการจอง</div>';

            window._rows = rows;
        }

        async function act(id, action) {
            const reservation = window._rows.find(
                (row) => row.reservation_id === id
            );

            if (action === 'checkout') {
                await API.checkout(reservation);
            } else {
                await API.setStatus(reservation, action);
            }

            load();
        }

        load();
        API.live(['reservations'], load);

        API.autoNoShow();
        setInterval(() => API.autoNoShow().then(load), 60000); // No-show หลัง 10 นาที
    </script>
