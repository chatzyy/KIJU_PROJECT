        <div class="p-6 text-sm font-bold">คุณ สมศักดิ์</div>

    <main class="flex-1 overflow-y-auto">
        <header class="border-b border-gray-200/50 px-8 py-6">
            <h2 class="text-xl font-bold">แจ้งเตือน</h2>
            <p class="text-xs text-gray-500">Alerts</p>
        </header>

        <div class="p-8">
            <div id="notiList" class="max-w-2xl"></div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="/project/web/js/supabase.js"></script>

    <script>
        // ต้องมี id: notiList
        const notificationList = document.getElementById('notiList');

        async function load() {
            const notifications = await API.myNotifications();

            notificationList.innerHTML = notifications.length
                ? notifications
                    .map((notification) => `
                        <div class="mb-3 rounded-xl border bg-white p-4">
                            <div class="text-sm">${notification.message}</div>
                            <div class="text-[10px] text-gray-400">
                                ${new Date(notification.created_at).toLocaleString('th-TH')}
                            </div>
                        </div>
                    `)
                    .join('')
                : '<div class="text-sm text-gray-400">ยังไม่มีการแจ้งเตือน</div>';
        }

        load();
        API.live(['notifications'], load);
    </script>
