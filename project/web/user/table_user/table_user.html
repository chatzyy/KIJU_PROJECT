    <script>
        // หน้าจองโต๊ะ ต้องมี id: name, phone, partySize, time, tableGrid, btnBook
        let selected = null;

        async function renderTables() {
            const tables = await API.tables();
            const tableGrid = document.getElementById('tableGrid');

            tableGrid.innerHTML = tables
                .map((table) => {
                    const isUnavailable = table.status !== 'available';
                    const isSelected = table.table_id === selected;

                    const buttonClass = isUnavailable
                        ? 'bg-gray-200 text-gray-400'
                        : isSelected
                            ? 'bg-orange-500 text-white'
                            : 'bg-white hover:bg-orange-50';

                    return `
                        <button
                            data-id="${table.table_id}"
                            ${isUnavailable ? 'disabled' : ''}
                            class="rounded-xl border p-3 text-sm ${buttonClass}"
                        >
                            ${table.table_id}
                            <div class="text-[10px]">${table.capacity} ที่นั่ง</div>
                        </button>
                    `;
                })
                .join('');

            document
                .querySelectorAll('#tableGrid button:not([disabled])')
                .forEach((button) => {
                    button.onclick = () => {
                        selected = button.dataset.id;
                        renderTables();
                    };
                });
        }

        document.getElementById('btnBook').onclick = async () => {
            const getValue = (id) =>
                document.getElementById(id).value.trim();

            if (
                !getValue('name') ||
                !getValue('partySize') ||
                !getValue('time') ||
                !selected
            ) {
                return alert('กรอกข้อมูลและเลือกโต๊ะให้ครบ');
            }

            try {
                await API.book({
                    name: getValue('name'),
                    phone: getValue('phone'),
                    partySize: Number(getValue('partySize')),
                    tableId: selected,
                    time: getValue('time'),
                });

                alert('จองสำเร็จ');
                location.href = '/project/web/user/queue_user/queue_user.html';
            } catch (error) {
                alert(error.message);
                renderTables();
            }
        };

        renderTables();
        API.live(['tables'], renderTables);
    </script>
